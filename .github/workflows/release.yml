name: release

# Builds and publishes a GitHub Release with the Lazarus (Linux) app and the
# Flutter port for Linux, Windows and Android.  Assets are built by separate
# jobs and attached by the final publish job.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lazarus-linux:
    name: Lazarus (Linux x86_64)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install toolchain
        run: |
          pacman -Sy --noconfirm --needed \
            git make binutils \
            lazarus-qt6 qt6-base qt6-svg qt6-5compat \
            fontconfig ttf-dejavu libarchive libwebp groff

      - uses: actions/checkout@v4

      - name: Release build
        run: make release

      - name: Package (binary + man page + desktop entry + icon)
        run: |
          VER="${GITHUB_REF_NAME//\//-}"
          STAGE="cbzmanager-${VER}-linux-x86_64"
          mkdir -p "$STAGE"
          install -Dm755 bin/release/x86_64-linux/cbzmanager "$STAGE/usr/bin/cbzmanager"
          install -Dm644 man/cbzmanager.1 "$STAGE/usr/share/man/man1/cbzmanager.1"
          install -Dm644 pkg/cbzmanager.desktop "$STAGE/usr/share/applications/cbzmanager.desktop"
          install -Dm644 pkg/cbzmanager.svg "$STAGE/usr/share/icons/hicolor/scalable/apps/cbzmanager.svg"
          tar -czf "cbzmanager-${VER}-linux-x86_64.tar.gz" "$STAGE"
          rm -rf "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: lazarus-linux
          path: cbzmanager-*-linux-x86_64.tar.gz

  flutter-linux:
    name: Flutter (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libarchive-dev libwebp-dev

      - name: Dependencies
        working-directory: flutter/app
        run: flutter pub get

      - name: Build
        working-directory: flutter/app
        run: flutter build linux --release

      - name: Package
        working-directory: flutter/app
        run: |
          VER="${GITHUB_REF_NAME//\//-}"
          tar -C build/linux/x64/release -czf \
            "cbzmanager-flutter-${VER}-linux-x86_64.tar.gz" bundle

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-linux
          path: flutter/app/cbzmanager-flutter-*-linux-x86_64.tar.gz

  flutter-windows:
    name: Flutter (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: flutter/app
        run: flutter pub get

      - name: Build
        working-directory: flutter/app
        run: flutter build windows --release

      - name: Package
        working-directory: flutter/app
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '/','-'
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath "cbzmanager-flutter-$ver-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-windows
          path: flutter/app/cbzmanager-flutter-*-windows-x86_64.zip

  flutter-android:
    name: Flutter (Android universal APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: flutter/app
        run: flutter pub get

      # The runner image ships the Android SDK with the licences accepted.
      # The template signs release builds with the debug key; add a keystore
      # here (and a signingConfig) before distributing on a store.
      - name: Build
        working-directory: flutter/app
        run: flutter build apk --release

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME//\//-}"
          cp flutter/app/build/app/outputs/flutter-apk/app-release.apk \
            "cbzmanager-flutter-${VER}-android-universal.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-android
          path: cbzmanager-flutter-*-android-universal.apk

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [lazarus-linux, flutter-linux, flutter-windows, flutter-android]
    # Tag pushes only: a manual dispatch just builds and uploads artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | Asset |
            |---|---|
            | Linux (Lazarus GUI + CLI) | `cbzmanager-<version>-linux-x86_64.tar.gz` |
            | Linux (Flutter port) | `cbzmanager-flutter-<version>-linux-x86_64.tar.gz` |
            | Windows (Flutter port) | `cbzmanager-flutter-<version>-windows-x86_64.zip` |
            | Android (Flutter port) | `cbzmanager-flutter-<version>-android-universal.apk` |

            The Lazarus tarball unpacks to a `usr/` tree (binary, man page,
            desktop entry, icon).  The Android APK is signed with the debug
            key (fine for sideloading, not for store distribution).  CBR
            support needs libarchive; WebP previews need libwebp.
