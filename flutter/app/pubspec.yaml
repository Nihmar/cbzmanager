name: cbzmanager
description: "Comic archive manager (CBZ/CBR): browse, validate, convert, merge and edit pages."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  archive: ^4.3.0
  image: ^4.10.1
  ffi: ^2.2.0
  path: ^1.9.1
  dart_smb2: ^0.1.3
  flutter_riverpod: ^3.4.3
  file_selector: ^1.1.0
  pool: ^1.5.3
  xml: ^7.0.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
