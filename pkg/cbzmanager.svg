<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    
    <!-- Zipper Gradient -->
    <linearGradient id="z-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Halftone Patterns -->
    <pattern id="halftone" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="3" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <pattern id="halftone-page" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2.5" fill="#6366f1" opacity="0.15"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="shadow-z" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#c2410c" flood-opacity="0.35"/>
    </filter>

    <!-- Clipping Path for Page Pattern -->
    <clipPath id="page-clip">
      <path d="M 120 132 L 304 132 L 304 184 L 356 184 L 356 396 L 120 396 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg-grad)"/>
  <rect width="512" height="512" rx="80" fill="url(#halftone)"/>

  <!-- Stack of Pages -->
  <!-- Back page -->
  <rect x="136" y="136" width="240" height="280" rx="12" fill="#4338ca" filter="url(#shadow)"/>
  <!-- Middle page -->
  <rect x="128" y="128" width="240" height="280" rx="12" fill="#6366f1" filter="url(#shadow)"/>
  
  <!-- Front page -->
  <path d="M 120 132 L 304 132 L 304 184 L 356 184 L 356 396 L 120 396 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Front page halftone pattern -->
  <rect x="120" y="132" width="236" height="264" fill="url(#halftone-page)" clip-path="url(#page-clip)"/>

  <!-- Folded corner flap -->
  <path d="M 304 132 L 356 132 L 356 184 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Fold shadow -->
  <path d="M 304 132 L 356 184 L 304 184 Z" fill="#000000" opacity="0.06"/>

  <!-- Zipper 'Z' -->
  <g filter="url(#shadow-z)">
    <path d="M 168 204 L 308 204 L 168 324 L 308 324" stroke="url(#z-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Zipper pull tab -->
    <g transform="translate(308, 324)">
      <circle cx="0" cy="0" r="16" fill="url(#z-grad)" stroke="#ffffff" stroke-width="3"/>
      <rect x="-10" y="4" width="20" height="24" rx="6" fill="#c2410c" stroke="#ffffff" stroke-width="2"/>
      <!-- Metallic shine on pull -->
      <path d="M -4 10 L 4 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>

  <!-- Comic Book Sparks -->
  <path d="M 290 204 L 293 213 L 302 216 L 293 219 L 290 228 L 287 219 L 278 216 L 287 213 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 332 293 L 334 297 L 338 299 L 334 301 L 332 305 L 330 301 L 326 299 L 330 297 Z" fill="#fbbf24" opacity="0.7"/>
</svg>