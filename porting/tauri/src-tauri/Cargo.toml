[package]
name = "cbzmanager-tauri-app"
version = "0.1.0"
description = "CBZ Manager — Tauri GUI"
authors = ["CBZ Manager Contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
rust-core = { path = "../rust-core", features = ["cbr"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
tauri = { workspace = true }
tauri-plugin-shell = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
